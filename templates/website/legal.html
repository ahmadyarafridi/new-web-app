{% extends 'base.html' %}

{% block title %}{{ page_title }} — {{ restaurant.name }}{% endblock %}

{% block content %}
<section style="padding: 40px 20px; max-width: 900px; margin: 0 auto; color: var(--color-text-gray);">
    <div style="margin-bottom: 30px; border-bottom: 1px solid var(--color-border); padding-bottom: 16px;">
        <span class="section-tag">{{ section_tag }}</span>
        <h1 style="font-family: var(--font-brand); color: #fff; font-size: 2rem; margin-top: 6px;">{{ page_title }}</h1>
        <p style="font-size: 0.85rem; color: var(--color-text-muted);">Last updated: {{ updated_date }}</p>
    </div>

    <div style="line-height: 1.8; font-size: 0.95rem; display: flex; flex-direction: column; gap: 24px;">
        {% for item in legal_items %}
        <div>
            <h3 style="color: var(--color-primary); font-family: var(--font-brand); font-size: 1.15rem; margin-bottom: 8px;">{{ item.title }}</h3>
            <p>{{ item.content }}</p>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
