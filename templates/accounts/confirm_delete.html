{% extends 'accounts/dashboard_base.html' %}

{% block dashboard_content %}
<div class="dashboard-card" style="max-width: 380px; margin: 20px auto; text-align: center; padding: 24px 20px;">

    <div style="width: 50px; height: 50px; border-radius: 50%; background: rgba(201,168,76,0.12); color: var(--color-primary); border: 1px solid rgba(201,168,76,0.3); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; margin: 0 auto 16px;">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>

    <h3 style="font-family: var(--font-brand); color: #fff; font-size: 1.1rem; margin-bottom: 8px;">Confirm Delete</h3>

    <p style="color: var(--color-text-gray); font-size: 0.82rem; line-height: 1.5; margin-bottom: 20px;">
        Are you sure you want to delete this {{ type }}: <strong style="color: #fff;">"{{ object_name }}"</strong>?
    </p>

    <form method="post" style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
        {% csrf_token %}
        <a href="{% url cancel_url %}" class="btn-secondary" style="border-color: var(--color-primary); color: var(--color-primary); padding: 8px 16px; font-size: 0.78rem; font-weight: 600; text-decoration: none; border-radius: var(--border-radius-sm); display: inline-flex; align-items: center; justify-content: center; width: fit-content; max-width: max-content;">
            &larr; Cancel
        </a>
        <button type="submit" class="btn-secondary" style="border-color: var(--color-primary); color: var(--color-primary); padding: 8px 16px; font-size: 0.78rem; font-weight: 600; text-decoration: none; border-radius: var(--border-radius-sm); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: fit-content; max-width: max-content;">
            <i class="fa-solid fa-trash" style="margin-right: 4px;"></i> Delete
        </button>
    </form>

</div>
{% endblock %}
